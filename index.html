'use strict';
const catalog={top:['制服衬衫','樱花粉针织衫','米白色开衫','薄荷绿卫衣'],bottom:['海蓝百褶裙','黑色百褶裙','奶油白短裙','牛仔长裤'],socks:['白色过膝袜','黑色过膝袜','短款白袜'],shoes:['棕色乐福鞋','白色运动鞋','黑色短靴']};
const colors={top:['#f9fafc','#f2a6c6','#fff0db','#a6dfcf'],bottom:['#568dca','#41445b','#fff5e7','#638dbd'],socks:['#fffdf9','#353545','#fffdf9'],shoes:['#8e5a48','#fdfcfb','#393544']};
const cats=['top','bottom','socks','shoes'],cn={top:'上衣',bottom:'下装',socks:'袜子',shoes:'鞋子'};let category='top';let state={top:0,bottom:0,socks:0,shoes:0};let history=[];let challenge='';
const $=id=>document.getElementById(id);function snapshot(){return {...state}}
function apply(next,remember=true){if(remember){history.push(snapshot());if(history.length>30)history.shift()}state={...next};for(const c of cats){$(c).src=svgData[c+state[c]];}render();try{localStorage.setItem('chitoge-v8-current',JSON.stringify(state))}catch(e){}}
function select(c,i){apply({...state,[c]:i})}
function render(){document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===category));const root=$('items');root.replaceChildren();catalog[category].forEach((name,i)=>{let b=document.createElement('button');b.className='item'+(state[category]===i?' selected':'');let dot=document.createElement('span');dot.className='dot';dot.style.background=colors[category][i];b.append(dot,document.createTextNode(name));b.onclick=()=>select(category,i);root.append(b)});$('status').textContent=cats.map(c=>cn[c]+'：'+catalog[c][state[c]]).join(' · ')+(challenge?'\n当前挑战：'+challenge:'')}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});$('random').onclick=()=>{const s={};cats.forEach(c=>s[c]=Math.floor(Math.random()*catalog[c].length));apply(s)};$('undo').onclick=()=>{if(history.length)apply(history.pop(),false)};$('reset').onclick=()=>apply({top:0,bottom:0,socks:0,shoes:0});
const prompts=['校园日常：搭配制服衬衫和海蓝百褶裙','春日樱花：尝试粉色针织衫和奶油白短裙','街头休闲：尝试薄荷绿卫衣和牛仔长裤'];let challengeIndex=-1;$('challenge').onclick=()=>{challengeIndex=(challengeIndex+1)%prompts.length;challenge=prompts[challengeIndex];render()};
function getSaved(){try{return JSON.parse(localStorage.getItem('chitoge-v8-saved')||'[]')}catch(e){return []}}
function renderSaved(){const root=$('saved');root.replaceChildren();getSaved().forEach((entry,i)=>{let b=document.createElement('button');b.textContent=entry.name;b.onclick=()=>apply(entry.state);root.append(b)})}
$('save').onclick=()=>{let saved=getSaved(),name=$('lookname').value.trim()||'搭配 '+(saved.length+1);saved.push({name,state:snapshot()});saved=saved.slice(-12);try{localStorage.setItem('chitoge-v8-saved',JSON.stringify(saved))}catch(e){}renderSaved()};
$('export').onclick=async()=>{const canvas=document.createElement('canvas');canvas.width=800;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff2f8';ctx.fillRect(0,0,800,1200);for(const file of ['base.svg',...['socks','bottom','shoes','top'].map(c=>svgData[c+state[c]])]){const image=new Image();image.src=file;await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject});ctx.drawImage(image,0,0,800,1200)}canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='千棘的衣橱-搭配.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)},'image/png')};
try{const saved=JSON.parse(localStorage.getItem('chitoge-v8-current')||'null');if(saved&&cats.every(c=>Number.isInteger(saved[c])&&saved[c]>=0&&saved[c]<catalog[c].length))state=saved}catch(e){}apply(state,false);renderSaved();
</script></body></html>
